# The gate on the Windows runner of fs-release (windows-2022): the named-pipe transport is built and tested here, never
# cross-built. Own steps instead of the reusable check.yml: the crate is linted and tested with the same flags.
name: windows
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: FreeSynergy-Net/fs-release/actions/setup-rust@9eed5c95eb7311f2b68266a012ec778f51e3ac38
        with:
          components: rustfmt,clippy
          cache-key: windows
      - run: cargo fmt --check -p fs-trusted-path -p fs-rpc
      - run: cargo clippy -p fs-trusted-path -p fs-rpc --all-targets --all-features --locked -- -D warnings -W clippy::pedantic
      - run: cargo test -p fs-trusted-path -p fs-rpc --all-features --locked --no-fail-fast
