# THROWAWAY mutant run (never merged): the same tests, once per mutant; a red test per mutant is the proof.
name: windows
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: FreeSynergy-Net/fs-release/actions/setup-rust@15935ed0d847d522fcb43d93e340ad1b14809639
        with:
          components: rustfmt,clippy
          cache-key: windows-mut
      - name: mutants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test -p fs-trusted-path --all-features --locked --no-run
          function Run($name, $mut, $drop) {
            $env:FS_MUT = $mut
            $env:FS_MUT_DROP = $drop
            $out = ""
            foreach ($t in @("--lib", "--test windows", "--test windows_rights")) {
              $out += (Invoke-Expression "cargo test -p fs-trusted-path --all-features --locked $t 2>&1" | Out-String)
            }
            $failed = ([regex]::Matches($out, 'test (\S+) \.\.\. FAILED') | ForEach-Object { $_.Groups[1].Value }) -join ' | '
            Write-Output "MUTANT [$name] exit=$LASTEXITCODE RED: $failed"
          }
          Run 'none' '' ''
          Run 'M1-no-local-disk-check' 'nodisk' ''
          Run 'M1-no-drive-type-check' 'notfixed' ''
          Run 'M1-no-subst-check' 'nosubst' ''
          Run 'M3-unknown-ace-skipped' 'skipunknown' ''
          Run 'M2c-null-dacl-ok' 'nulldacl' ''
          Run 'M2a-user-is-a-trusted-owner' 'ownerme' ''
          $bits = @{ 'FILE_WRITE_DATA'='2'; 'FILE_APPEND_DATA'='4'; 'FILE_WRITE_EA'='10'; 'FILE_DELETE_CHILD'='40'; 'FILE_WRITE_ATTRIBUTES'='100'; 'DELETE'='10000'; 'WRITE_DAC'='40000'; 'WRITE_OWNER'='80000'; 'GENERIC_WRITE'='40000000'; 'GENERIC_ALL'='10000000'; 'MAXIMUM_ALLOWED'='2000000' }
          foreach ($k in $bits.Keys) { Run "M2b-right-removed-$k" '' $bits[$k] }
