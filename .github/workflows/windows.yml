# The gate on the Windows runner of fs-release (windows-2022): the named-pipe transport is built and tested here, never
# cross-built. Own steps instead of the reusable check.yml: the crate is linted and tested with the same flags.
name: windows
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: FreeSynergy-Net/fs-release/actions/setup-rust@9eed5c95eb7311f2b68266a012ec778f51e3ac38
        with:
          components: rustfmt,clippy
          cache-key: windows
      - name: mutants (THROWAWAY, review only)
        shell: pwsh
        run: |
          cargo test -p fs-trusted-path --all-features --locked --no-run
          foreach ($name in @("none","J-notfixed","J-nosubst","J-noletter","W-notfixed","W-nosubst","F-isfixed","F-issubst")) {
            $env:MUTANT = $name
            $out = (cargo test -p fs-trusted-path --all-features --locked --no-fail-fast 2>&1 | Out-String)
            $code = $LASTEXITCODE
            $failed = ([regex]::Matches($out, "test (\S+) \.\.\. FAILED") | ForEach-Object { $_.Groups[1].Value }) -join " | "
            $ran = ([regex]::Matches($out, "test result: \S+\. \d+ passed; \d+ failed") | ForEach-Object { $_.Value }) -join " ; "
            Write-Output "MUTANT [$name] exit=$code RED: $failed"
            Write-Output "MUTANT [$name] RESULTS: $ran"
            if ($name -eq "none") { Write-Output $out }
          }
