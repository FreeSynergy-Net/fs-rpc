# cargo-nextest profiles for fs-rpc (workflow testlauf, CLAUDE.md §4: little but often). Template: fs-components 216594c0.
#
# Run:  cargo nextest run -p <crate> --all-features --profile <quick|time|security|platform|picture|release>
# Levels: `quick` for a finished module (seconds); `time` for the 10x rule (add --stress-count 10); `security` before a release;
# `platform` for Linux/Windows differences; `picture` is not defined (nothing is drawn here; nextest refuses a filter that matches nothing, the gate then skips it with a line);
# `release` = everything (CI only, hard limit 1).
#
# NAME CONVENTION (the filtersets read it; a new test follows it so it lands in the right level):
#   time      : file name `*_time` / `time.rs`, or a test that sleeps (rpc_idle, rpc_health_watch)
#   socket    : file name contains `socket` / `single` / `signal` / `heartbeat` / `handshake` / `reconnect` / `hold` (real socket, pipe, process, signal)
#   security  : file name contains `human_only`, `attacks`, `refused`, `peer`, `actor`, or the test name contains `restricted` / `security`
#   platform  : files of fs-trusted-path (`unix.rs`, `windows*.rs`, `module_service.rs`) and `rpc_datadir`, `rpc_socket*`
#   everything else = unit / model test: level quick.
# Binary ids look like `<crate>::<test-file>` (unit tests: `<crate>`).

[profile.default]
fail-fast = false

# Level 1: unit and model tests only; stops at the first failure.
[profile.quick]
default-filter = "not (binary(/_time$|^time$|rpc_idle|health_watch/) | binary(/socket|single|signal|heartbeat|handshake|reconnect|hold|datadir|^unix$|^windows|module_service/) | binary(/human_only|attacks|refused|peer|actor/) | test(/restricted|security/))"
fail-fast = true
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }

# Level 2: timing tests. The 10x rule: run with `--stress-count 10`; a flaky test is an error, so NO retries hide it.
[profile.time]
default-filter = "binary(/_time$|^time$|rpc_idle|health_watch/)"
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }

# Security: peer check, human only, single-instance attacks, rights. Full run before a release (CLAUDE.md §4 hard limit 2).
[profile.security]
default-filter = "binary(/human_only|attacks|refused|peer|actor/) | test(/restricted|security/)"
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }

# Platform differences (Linux vs Windows): sockets, pipes, signals, processes, data folder, drive and rights checks.
[profile.platform]
default-filter = "binary(/socket|single|signal|heartbeat|handshake|reconnect|hold|datadir|^unix$|^windows|module_service/)"
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }

# Everything (release gate, CI): no filter, no retries, no fail-fast so the whole list of failures is seen.
[profile.release]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 10 }
