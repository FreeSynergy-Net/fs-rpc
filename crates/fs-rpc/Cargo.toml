[package]
name = "fs-rpc"
description = "FreeSynergy RPC runtime: the shared server and client side of every interface contract (Unix socket and named pipe, Cap'n Proto RPC, envelope on the wire, RFC 9457 problems as RPC errors, pages, change feed, version handshake)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# Pins by tag, each straight from the owner's repository (ADR 0092, ADR 0093): fs-types is no longer reached through fs-interfaces.
# fs-interfaces and fs-objects: by `rev` (the landed heads) until their tags exist; then switch to `tag = "v0.2.0"` (fs-interfaces) and `tag = "v0.0.11"` (fs-objects).
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", tag = "v0.0.6", version = "0.0.5" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "e6f69213b68b47e139fc8038c8a095f9ed1fef3c", version = "0.2.0" }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "f6409f2a5378ba1464e69ae216efd4d27d249182", version = "0.0.11" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "signal", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = "1"

[target.'cfg(unix)'.dependencies]
# Who is on the other end of a Unix socket, and who runs this; the tests send themselves signals.
rustix = { version = "1", features = ["process", "net", "param", "event", "pipe"] }

[target.'cfg(windows)'.dependencies]
# The Windows identity and rights basics (moved out of this crate into fs-trusted-path).
fs-trusted-path = { path = "../fs-trusted-path", version = "0.1.4" }
# Who is on the other end of a named pipe, and who runs this; rights of the pipe and of the data folder.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
