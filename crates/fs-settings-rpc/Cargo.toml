[package]
name = "fs-settings-rpc"
description = "FreeSynergy settings over RPC: the client RpcSettingsStore (the port SettingsStore over the contract settings), the server skeleton SettingsService (the contract over any port) and ensure_service (one settings service per person)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
fs-rpc = { path = "../fs-rpc" }
# PROVISIONAL (probe): path to a LOCAL stand-in of the port delta B1 (not pushed anywhere): the head 6c05ece of
# `unreviewed/probe-settingsstore-v1` is marked WIP/not built and has no `os_user` in `Stampd`. Then: git = fs-components, rev = <head B1>
# ([LOCK-STRIKT]: branch/path pins in the probe only, tags before release).
fs-settings = { path = "../../../settings-b1/crates/fs-settings" }
fs-types = { git = "https://github.com/FreeSynergy/fs-types", tag = "v0.0.1" }
# PROVISIONAL: the contract `settings` (schema/settings.capnp, draft 0.2) is compiled in this crate until fs-interfaces 0.0.28
# carries it (B0, `unreviewed/interfaces-settings`); `common.capnp` comes from the v0.0.27 pin of fs-rpc.
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.27" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time"] }
futures = "0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time", "rt-multi-thread"] }
