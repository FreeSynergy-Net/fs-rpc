[package]
name = "fs-settings-rpc"
description = "FreeSynergy settings over RPC: the client RpcSettingsStore (the port SettingsStore over the contract settings), the server skeleton SettingsService (the contract over any port) and ensure_service (one settings service per person)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
fs-rpc = { path = "../fs-rpc" }
# PROVISIONAL (probe): git pin on the head of the branch `unreviewed/probe-settingsstore-v1` (B1); branch/rev pins are allowed in the
# probe only ([LOCK-STRIKT]), the tag replaces them before release.
fs-settings = { git = "https://github.com/FreeSynergy/fs-components", rev = "eda35b36e3a6021615aba925cf7c0c7da64a0969" }
fs-types = { git = "https://github.com/FreeSynergy/fs-types", tag = "v0.0.1" }
# PROVISIONAL (probe): B0, the branch `unreviewed/interfaces-settings` carries `settings_capnp` (contract draft 0.2); one source for the
# whole workspace (ADR 0092); the tag 0.0.28 replaces the rev.
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", rev = "08f0a93be4344a79d73058d81250015354c76ebf" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time"] }
futures = "0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time", "rt-multi-thread"] }
