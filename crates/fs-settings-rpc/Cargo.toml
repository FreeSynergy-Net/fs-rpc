[package]
name = "fs-settings-rpc"
description = "FreeSynergy settings over RPC: the client RpcSettingsStore (the port SettingsStore over the contract settings), the server skeleton SettingsService (the contract over any port) and ensure_service (one settings service per person)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
fs-rpc = { path = "../fs-rpc" }
# PROVISIONAL (probe): git pin on the head of fs-components main (B1 landed) (B1); branch/rev pins are allowed in the
# probe only ([LOCK-STRIKT]), the tag replaces them before release.
fs-settings = { git = "https://github.com/FreeSynergy/fs-components", rev = "81a83e28b75cad1b5e25baa8695d50ce9ebd7490" }
fs-types = { git = "https://github.com/FreeSynergy/fs-types", tag = "v0.0.1" }
# `common.capnp` stays at the tag v0.0.27 (one source with fs-rpc). The contract `settings` is a byte-equal copy of B0 (fs-interfaces
# `unreviewed/interfaces-settings` 08f0a93: `schema/settings.capnp`, `src/settings_capnp.rs`): a rev pin of fs-interfaces would bring fs-types
# v0.0.3 next to the v0.0.1 of fs-rpc and fs-settings (two copies of every type, fs-rpc's catalog test no longer compiles).
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.27" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time"] }
futures = "0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time", "rt-multi-thread"] }
