[package]
name = "fs-settings-rpc"
description = "FreeSynergy settings over RPC: the client RpcSettingsStore (the port SettingsStore over the contract settings), the server skeleton SettingsService (the contract over any port) and ensure_service (one settings service per person)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# The suite `store` of fs-settings over RPC (tests only; never in the normal graph).
conformance = ["fs-settings/conformance"]

[dependencies]
fs-rpc = { path = "../fs-rpc", version = "0.1.4" }
# Pins by `rev`, each straight from the owner's repository: one source per library (fs-settings = crate of repo fs-components).
fs-settings = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "9ab4ac280fb2354d41fdbc15bdbed92664a016de", version = "0.1.0" }
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290", version = "0.0.7" }
# `settings_capnp` (contract settings 0.2) and `common_capnp` come from fs-interfaces; no schema copy in this crate.
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "2bb70d826681403894ec6d65a7fad9d3a3f51ac2", version = "0.2.0" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time"] }
futures = "0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
# The frame of the suites (repo fs-types).
fs-conformance = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290", version = "0.0.7" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time", "rt-multi-thread"] }
