[package]
name = "fs-settings-rpc"
description = "FreeSynergy settings over RPC: the client RpcSettingsStore (the port SettingsStore over the contract settings), the server skeleton SettingsService (the contract over any port) and ensure_service (one settings service per person)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# The suite `store` of fs-settings over RPC (tests only; never in the normal graph).
conformance = ["fs-settings/conformance"]

[dependencies]
fs-rpc = { path = "../fs-rpc" }
# Pins by tag, each straight from the owner's repository: one source per library (fs-types only v0.0.4).
fs-settings = { git = "https://github.com/FreeSynergy-Net/fs-components", tag = "v0.0.35" }
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", tag = "v0.0.6" }
# `settings_capnp` (contract settings 0.2) and `common_capnp` come from fs-interfaces; no schema copy in this crate.
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", tag = "v0.0.34" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time"] }
futures = "0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
# The frame of the suites (repo fs-types).
fs-conformance = { git = "https://github.com/FreeSynergy-Net/fs-types", tag = "v0.0.6" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time", "rt-multi-thread"] }
