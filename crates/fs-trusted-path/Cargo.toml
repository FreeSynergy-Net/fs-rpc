[package]
name = "fs-trusted-path"
description = "FreeSynergy places: is this path the system's (owned by the system owner, nobody else can write it, no link on the way), on Unix and on Windows; plus the Windows identity and rights basics (SID, token owner, private folder) shared by fs-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[target.'cfg(windows)'.dependencies]
# Owner and rights of a path, the user of a token; one place for it (fs-rpc and fs-starter both use it).
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
  "Win32_System_Com", "Win32_UI_Shell",
  "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading",
] }

[features]
# `Trust::for_test`: an own circle of trust, for tests only (never on in a program).
test-support = []

[target.'cfg(windows)'.dev-dependencies]
# The tests make their own ACLs (SDDL) and owners, apart from the code under test.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
tempfile = "3"
# Its own tests use `Trust::for_test`.
fs-trusted-path = { path = ".", features = ["test-support"] }
