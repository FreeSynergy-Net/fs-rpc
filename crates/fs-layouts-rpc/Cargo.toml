[package]
name = "fs-layouts-rpc"
description = "FreeSynergy layouts over RPC: the client RpcLayouts (the ports LayoutRead, LayoutWrite, PackageLayouts and OverlayWrite over the contract layouts), the server skeleton LayoutService (the contract over any port) and ensure_service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
fs-rpc = { path = "../fs-rpc" }
# PROVISIONAL (probe): git pin on the head of the fs-forms branch `unreviewed/probe-forms-f1b` (the ports and the model, probe F1b);
# a rev pin is allowed in the probe only ([LOCK-STRIKT]); the tag replaces it before release. fs-forms-layout brings sha2 and nothing else.
fs-forms-layout = { git = "https://github.com/FreeSynergy/fs-forms", rev = "ef6c818fecb51bc4102b9c1fd74f37a303e16335" }
# `common.capnp` stays at the tag v0.0.27 (one source with fs-rpc), as in fs-settings-rpc. The contracts `layouts` and `bind` are
# provisional copies of the drafts (see README), compiled into this crate.
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.27" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time"] }
futures = "0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time", "rt-multi-thread"] }
